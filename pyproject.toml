[project]
name = "meetstream-content-factory"
version = "0.1.0"
description = "Turn a MeetStream webinar recording into a reviewable, source-linked content package"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
transcribe = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
contentfactory-mcp = "contentfactory.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contentfactory*"]

[tool.setuptools.package-data]
contentfactory = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
