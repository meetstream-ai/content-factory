[project]
name = "meetstream-content-factory"
version = "0.1.0"
description = "Turn a MeetStream webinar recording into a reviewable, source-linked content package"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=3.40,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<0.1",
    "faster-whisper>=1.1,<2",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
contentfactory-mcp = "contentfactory.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contentfactory*"]

[tool.setuptools.package-data]
contentfactory = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
